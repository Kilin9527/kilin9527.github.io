# Builds the Vite site and publishes it to GitHub Pages.
#
# Required one-time manual step: repository Settings -> Pages -> Build and
# deployment -> Source must be set to "GitHub Actions". This workflow cannot set
# it, and `deploy-pages` fails with "Get Pages site failed" until it is set.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but never cancel one that is already
# running — killing an in-flight Pages deploy can leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pin the major so a runner image change can't break the build.
          # Vite 8 needs Node 20.19+ / 22.12+.
          node-version: 22
          cache: npm

      # Requires package-lock.json to be committed.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Vite writes the production build to ./dist — not ./build or ./public.
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
